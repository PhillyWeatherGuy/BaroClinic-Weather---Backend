name: Generate Weather Maps

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-plot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Linux System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev libeccodes-tools

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray pillow cfgrib ecmwf-opendata rioxarray boto3 opencv-python-headless matplotlib zstandard contourpy

    - name: Run Weather Data Texture Pipeline & Upload to B2
      env:
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      run: |
        python process.py