name: Generate Weather Maps

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-plot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Linux System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev libeccodes-tools

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray pillow cfgrib ecmwf-opendata rioxarray

    - name: Run Weather Data Texture Pipeline
      run: |
        python process.py

    - name: Flatten History and Force Push (1GB Protection Limit)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add -A
        
        if ! git diff-index --quiet HEAD; then
          echo "🔄 New changes detected. Flattening branch history..."
          git checkout --orphan temp-branch
          git commit -m "🎨 Sync weather data textures [Clean History]"
          git branch -M temp-branch main
          git push origin main --force
        else
          echo "✅ No new changes detected."
        fi

    - name: Upload Artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4